version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: Africa/Dakar
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      npm:
        applies-to: version-updates
        patterns: ['*']
      npmsec:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: Africa/Dakar
    commit-message:
      prefix: ci(deps)
    groups:
      ci:
        applies-to: version-updates
        patterns: ['*']
      cisec:
        applies-to: security-updates
        patterns: ['*']
