name: Bug
description: Signaler un comportement incorrect et reproductible.
title: 'Bug | '
labels: [bug]
body:
  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
      value: '1. '
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Résultat attendu
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Résultat obtenu
      description: Ne pas joindre de clé, phrase secrète ou donnée personnelle.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environnement
      placeholder: Android, appareil, version app, regtest
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Capture ou logs nettoyés
