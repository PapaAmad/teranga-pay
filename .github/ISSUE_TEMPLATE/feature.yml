name: Nouvelle fonction
description: Décrire un résultat attendu et ses critères d'acceptation.
title: 'TXX — '
labels: [feature]
body:
  - type: input
    id: task
    attributes:
      label: Tâche et responsable
      placeholder: T18 — PAN ; relecture Salam
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Objectif en clair
      description: Qui en bénéficie et ce qui doit devenir possible.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Critères d'acceptation
      description: Résultats concrets à vérifier avant de fermer l'issue.
      value: '- [ ] '
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Périmètre, dépendances et méthode de validation
      description: Préciser les exclusions, les tâches liées et comment tester.
    validations:
      required: true
